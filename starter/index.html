</style></head><body><div class="wrap"><header><div class="kicker">OKAYAMA TRAVEL HELPER</div><h1>🍑 日本岡山 5 天 4 夜</h1><p>晴天之國・岡山 / 倉敷 / 吉備路<br>手機版示範行程，日期與費用均為教學資料</p></header><nav class="tabs" id="tabs" aria-label="選擇旅遊日期"></nav><main><section class="day"><small id="area"></small><h2 id="dayTitle"></h2><p id="summary"></p></section><h3 class="title">今日行程</h3><div id="activities"></div><h3 class="title">支出明細（日圓）</h3><div class="expense-list" id="expenses"></div><div class="todo">🪄 Codex 任務：請新增「今日支出總額」，切換 Day 1～Day 5 時自動加總並更新。</div><div class="overall" id="overall"></div><div class="warning">注意：這是課堂示範行程，非實際訂房、票券、航班或景點報價。</div></main><div class="footer">日本岡山 5 天 4 夜｜AI Vibe Coding 教學專用</div></div><script src="okayama-itinerary.js"></script><script>
const tabs=document.getElementById('tabs');let selectedDay=1;function yen(n){return '¥'+Number(n).toLocaleString('ja-JP')}
function render(dayNumber){selectedDay=dayNumber;const d=okayamaTrip.days[dayNumber-1];tabs.innerHTML=okayamaTrip.days.map(x=>`<button class="${x.day===dayNumber?'selected':''}" data-day="${x.day}">Day ${x.day}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(Number(b.dataset.day))));document.getElementById('area').textContent=d.area;document.getElementById('dayTitle').textContent=`Day ${d.day}｜${d.title}`;document.getElementById('summary').textContent=d.summary;document.getElementById('activities').innerHTML=d.activities.map(a=>`<article class="card"><div class="time">${a.time}</div><div><div class="activity">${a.name}</div><div class="memo">${a.memo}</div></div></article>`).join('');document.getElementById('expenses').innerHTML=d.expenses.map(e=>`<div class="expense-row"><span>${e.label}</span><b>${yen(e.amount)}</b></div>`).join('');// TODO: 讓 Codex 從 d.expenses 計算當日總額，並顯示在畫面中。
}
render(1);
</script></body></html>
